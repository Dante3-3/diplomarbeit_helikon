<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Loop Comparison Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
  <script>window.PropTypes = window.PropTypes || window.propTypes;</script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, RadarChart, Radar, PolarGrid, PolarAngleAxis, PolarRadiusAxis, LineChart, Line } = Recharts;

// ── DATA ────────────────────────────────────────────────────────────────────
const CATEGORIES = [
  { key: 'teil2', name: 'Vocabulary',          max: 40 },
  { key: 'teil3', name: 'Multiple Choice',     max: 45 },
  { key: 'teil4', name: 'Sentence Completion', max: 40 },
  { key: 'teil5', name: 'Grammar',             max: 40 },
  { key: 'teil6', name: 'True/False',          max: 40 },
  { key: 'teil7', name: 'Gap-Fill',            max: 40 },
  { key: 'teil8', name: 'Orthography',         max: 40 },
];

const MODELS = ['mistral:latest', 'gemma2:9b', 'qwen3.5:9b'];
const MODEL_LABELS = { 'mistral:latest': 'Mistral', 'gemma2:9b': 'Gemma2', 'qwen3.5:9b': 'Qwen3.5' };

// Scores: orig = languages branch (V1-V3, Prompts 1-3), v2 = post-structural, v3 = post-content
// Orig uses deepseek-r1:8b as 3rd model; V2/V3 use qwen3.5:9b → orig for qwen = null
// All scores evaluated with GPT-5.4 (avg of 2 runs for orig, 1 run for v2/v3)
const SCORES = {
  'teil2': {
    'mistral:latest': { orig: 29.5, v2: 25.0, v3: 24.0, max: 40 },
    'gemma2:9b':      { orig: 35.9, v2: 32.0, v3: 34.0, max: 40 },
    'qwen3.5:9b':     { orig: null, v2: 32.0, v3: 22.0, max: 40 },
  },
  'teil3': {
    'mistral:latest': { orig: 29.0, v2: 27.0, v3: 28.0, max: 45 },
    'gemma2:9b':      { orig: 35.0, v2: 32.0, v3: 34.0, max: 45 },
    'qwen3.5:9b':     { orig: null, v2: 30.0, v3: 30.0, max: 45 },
  },
  'teil4': {
    'mistral:latest': { orig: 21.3, v2: 22.0, v3: 23.0, max: 40 },
    'gemma2:9b':      { orig: 28.7, v2: 36.0, v3: 31.0, max: 40 },
    'qwen3.5:9b':     { orig: null, v2: 31.0, v3: 29.0, max: 40 },
  },
  'teil5': {
    'mistral:latest': { orig: 18.4, v2: 18.0, v3: 21.0, max: 40 },
    'gemma2:9b':      { orig: 30.3, v2: 27.0, v3: 24.0, max: 40 },
    'qwen3.5:9b':     { orig: null, v2: 19.0, v3: 15.0, max: 40 },
  },
  'teil6': {
    'mistral:latest': { orig: 28.6, v2: 25.0, v3: 26.0, max: 40 },
    'gemma2:9b':      { orig: 36.0, v2: 37.0, v3: 36.0, max: 40 },
    'qwen3.5:9b':     { orig: null, v2: 35.0, v3: 35.0, max: 40 },
  },
  'teil7': {
    'mistral:latest': { orig: 23.4, v2: 21.0, v3: 24.0, max: 40 },
    'gemma2:9b':      { orig: 25.3, v2: 31.0, v3: 26.0, max: 40 },
    'qwen3.5:9b':     { orig: null, v2: 23.0, v3: 24.0, max: 40 },
  },
  'teil8': {
    'mistral:latest': { orig: 14.0, v2: 12.0, v3: 12.0, max: 40 },
    'gemma2:9b':      { orig: 20.5, v2: 16.0, v3: 17.0, max: 40 },
    'qwen3.5:9b':     { orig: null, v2: 15.0, v3: 12.0, max: 40 },
  },
};

const FEEDBACK_STATS = {
  v2: { total: 126, fail: 121, revised: 121, failRate: 96 },
  v3: { total: 108, fail: 85, revised: 84, failRate: 79, humanReview: 18 },
};

const COLORS = {
  orig: '#6366f1',
  v2:   '#22d3ee',
  v3:   '#34d399',
  'mistral:latest': '#f59e0b',
  'gemma2:9b':      '#60a5fa',
  'qwen3.5:9b':     '#f472b6',
};

// ── HELPER ──────────────────────────────────────────────────────────────────
function pct(score, max) { return score != null ? Math.round(100 * score / max) : null; }
function delta(a, b) { if (a == null || b == null) return null; return Math.round((b - a) * 10) / 10; }
function DeltaBadge({ value }) {
  if (value == null) return <span className="text-gray-500 text-xs">—</span>;
  const pos = value > 0;
  const zero = value === 0;
  return (
    <span className={`text-xs font-bold px-1.5 py-0.5 rounded ${zero ? 'bg-gray-700 text-gray-300' : pos ? 'bg-emerald-900 text-emerald-300' : 'bg-red-900 text-red-300'}`}>
      {pos ? '+' : ''}{value}
    </span>
  );
}

// ── OVERVIEW BAR CHART ───────────────────────────────────────────────────────
function OverviewChart({ model }) {
  const data = CATEGORIES.map(cat => {
    const s = SCORES[cat.key][model];
    return {
      name: cat.name.replace(' ', '\n'),
      shortName: cat.name.split(' ')[0],
      Orig:  s.orig != null ? pct(s.orig, cat.max) : null,
      'V2 (Struktur)': pct(s.v2, cat.max),
      'V3 (Inhalt)':   pct(s.v3, cat.max),
    };
  });

  return (
    <ResponsiveContainer width="100%" height={300}>
      <BarChart data={data} margin={{ top: 10, right: 10, left: -10, bottom: 5 }}>
        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
        <XAxis dataKey="shortName" tick={{ fill: '#9ca3af', fontSize: 11 }} />
        <YAxis domain={[0, 100]} tick={{ fill: '#9ca3af', fontSize: 11 }} unit="%" />
        <Tooltip formatter={(v) => v != null ? `${v}%` : '—'} contentStyle={{ background: '#1f2937', border: '1px solid #374151', borderRadius: 8 }} />
        <Legend wrapperStyle={{ fontSize: 12 }} />
        <Bar dataKey="Orig" fill={COLORS.orig} radius={[3,3,0,0]} />
        <Bar dataKey="V2 (Struktur)" fill={COLORS.v2} radius={[3,3,0,0]} />
        <Bar dataKey="V3 (Inhalt)" fill={COLORS.v3} radius={[3,3,0,0]} />
      </BarChart>
    </ResponsiveContainer>
  );
}

// ── RADAR CHART ──────────────────────────────────────────────────────────────
function RadarOverview({ version }) {
  const data = CATEGORIES.map(cat => {
    const entry = { category: cat.name.replace(' ', ' ') };
    MODELS.forEach(m => {
      const s = SCORES[cat.key][m];
      entry[MODEL_LABELS[m]] = pct(s[version], cat.max);
    });
    return entry;
  });

  return (
    <ResponsiveContainer width="100%" height={320}>
      <RadarChart data={data}>
        <PolarGrid stroke="#374151" />
        <PolarAngleAxis dataKey="category" tick={{ fill: '#9ca3af', fontSize: 11 }} />
        <PolarRadiusAxis angle={30} domain={[0, 100]} tick={{ fill: '#6b7280', fontSize: 9 }} />
        {MODELS.map(m => (
          <Radar key={m} name={MODEL_LABELS[m]} dataKey={MODEL_LABELS[m]}
            stroke={COLORS[m]} fill={COLORS[m]} fillOpacity={0.15} strokeWidth={2} />
        ))}
        <Legend wrapperStyle={{ fontSize: 12 }} />
        <Tooltip contentStyle={{ background: '#1f2937', border: '1px solid #374151', borderRadius: 8 }} />
      </RadarChart>
    </ResponsiveContainer>
  );
}

// ── SCORE TABLE ───────────────────────────────────────────────────────────────
function ScoreTable() {
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-gray-400 border-b border-gray-700">
            <th className="text-left py-2 pr-4">Kategorie</th>
            <th className="text-left py-2 pr-4">Modell</th>
            <th className="text-center py-2 px-2">Orig</th>
            <th className="text-center py-2 px-2">V2</th>
            <th className="text-center py-2 px-2">Δ Orig→V2</th>
            <th className="text-center py-2 px-2">V3</th>
            <th className="text-center py-2 px-2">Δ V2→V3</th>
            <th className="text-center py-2 px-2">Δ Gesamt</th>
          </tr>
        </thead>
        <tbody>
          {CATEGORIES.map(cat => MODELS.map((model, mi) => {
            const s = SCORES[cat.key][model];
            const d12 = delta(s.orig, s.v2);
            const d23 = delta(s.v2, s.v3);
            const dtot = delta(s.orig, s.v3);
            return (
              <tr key={`${cat.key}-${model}`} className={`border-b border-gray-800 ${mi === 0 ? 'border-t border-gray-600' : ''}`}>
                {mi === 0 && <td rowSpan={3} className="py-2 pr-4 font-semibold text-gray-200 align-middle">{cat.name}</td>}
                <td className="py-1.5 pr-4">
                  <span className="text-xs px-2 py-0.5 rounded" style={{ background: COLORS[model] + '30', color: COLORS[model] }}>
                    {MODEL_LABELS[model]}
                  </span>
                </td>
                <td className="text-center py-1.5 px-2 text-gray-400">{s.orig != null ? `${s.orig}/${cat.max}` : '—'}</td>
                <td className="text-center py-1.5 px-2 font-mono">{s.v2 != null ? `${s.v2}/${cat.max}` : '—'}</td>
                <td className="text-center py-1.5 px-2"><DeltaBadge value={d12} /></td>
                <td className="text-center py-1.5 px-2 font-mono">{s.v3 != null ? `${s.v3}/${cat.max}` : '—'}</td>
                <td className="text-center py-1.5 px-2"><DeltaBadge value={d23} /></td>
                <td className="text-center py-1.5 px-2"><DeltaBadge value={dtot} /></td>
              </tr>
            );
          }))}
        </tbody>
      </table>
    </div>
  );
}

// ── STATS CARDS ───────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, color }) {
  return (
    <div className={`rounded-xl p-4 border ${color}`}>
      <div className="text-2xl font-bold">{value}</div>
      <div className="text-sm font-medium mt-1">{label}</div>
      {sub && <div className="text-xs text-gray-400 mt-1">{sub}</div>}
    </div>
  );
}

// ── V2→V3 IMPROVEMENT CHART ───────────────────────────────────────────────────
function ImprovementChart() {
  const data = CATEGORIES.map(cat => {
    const entry = { name: cat.name.split(' ')[0] };
    MODELS.forEach(m => {
      const s = SCORES[cat.key][m];
      entry[MODEL_LABELS[m]] = delta(s.v2, s.v3);
    });
    return entry;
  });

  return (
    <ResponsiveContainer width="100%" height={260}>
      <BarChart data={data} margin={{ top: 10, right: 10, left: -10, bottom: 5 }}>
        <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
        <XAxis dataKey="name" tick={{ fill: '#9ca3af', fontSize: 11 }} />
        <YAxis tick={{ fill: '#9ca3af', fontSize: 11 }} />
        <Tooltip contentStyle={{ background: '#1f2937', border: '1px solid #374151', borderRadius: 8 }}
          formatter={(v) => v != null ? `${v > 0 ? '+' : ''}${v} Punkte` : '—'} />
        <Legend wrapperStyle={{ fontSize: 12 }} />
        {MODELS.map(m => <Bar key={m} dataKey={MODEL_LABELS[m]} fill={COLORS[m]} radius={[3,3,0,0]} />)}
      </BarChart>
    </ResponsiveContainer>
  );
}

// ── MODEL AVERAGE CARDS ───────────────────────────────────────────────────────
function ModelAverages() {
  return (
    <div className="grid grid-cols-3 gap-4">
      {MODELS.map(model => {
        const cats = CATEGORIES.filter(c => SCORES[c.key][model].v2 != null);
        const avgV2 = cats.reduce((s, c) => s + pct(SCORES[c.key][model].v2, c.max), 0) / cats.length;
        const avgV3 = cats.reduce((s, c) => s + pct(SCORES[c.key][model].v3, c.max), 0) / cats.length;
        const catsOrig = cats.filter(c => SCORES[c.key][model].orig != null);
        const avgOrig = catsOrig.length > 0 ? catsOrig.reduce((s, c) => s + pct(SCORES[c.key][model].orig, c.max), 0) / catsOrig.length : null;
        const diff = Math.round((avgV3 - avgV2) * 10) / 10;

        return (
          <div key={model} className="rounded-xl bg-gray-800 border border-gray-700 p-4">
            <div className="font-bold text-lg mb-3" style={{ color: COLORS[model] }}>{MODEL_LABELS[model]}</div>
            <div className="space-y-2 text-sm">
              {avgOrig != null && <div className="flex justify-between"><span className="text-gray-400">Orig (Ø)</span><span style={{ color: COLORS.orig }}>{avgOrig.toFixed(1)}%</span></div>}
              <div className="flex justify-between"><span className="text-gray-400">V2 Strukturcheck (Ø)</span><span style={{ color: COLORS.v2 }}>{avgV2.toFixed(1)}%</span></div>
              <div className="flex justify-between"><span className="text-gray-400">V3 Inhaltscheck (Ø)</span><span style={{ color: COLORS.v3 }}>{avgV3.toFixed(1)}%</span></div>
              <div className="flex justify-between border-t border-gray-600 pt-2">
                <span className="text-gray-400">Δ V2→V3</span>
                <DeltaBadge value={diff} />
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [activeModel, setActiveModel] = useState('gemma2:9b');
  const [radarVersion, setRadarVersion] = useState('v2');

  return (
    <div className="max-w-7xl mx-auto p-6 space-y-8">
      {/* Header */}
      <div>
        <h1 className="text-3xl font-bold text-white">Feedback Loop Comparison Dashboard</h1>
        <p className="text-gray-400 mt-1">Vergleich: Originaler Run → V2 (Strukturcheck) → V3 (Inhaltscheck)</p>
        <div className="flex gap-4 mt-3 text-xs text-gray-500 flex-wrap">
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{background: COLORS.orig}}></span>Orig: languages branch, Prompts 1-3, mistral/gemma2/deepseek</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{background: COLORS.v2}}></span>V2: Prompts 4-5, mistral/gemma2/qwen3.5, +qwen2.5:3b Strukturcheck</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{background: COLORS.v3}}></span>V3: +qwen2.5:7b Inhaltscheck</span>
          <span className="text-yellow-500">★ Alle Scores bewertet mit GPT-5.4 (GitHub Copilot)</span>
        </div>
      </div>

      {/* Feedback Loop Stats */}
      <div>
        <h2 className="text-xl font-semibold mb-4 text-gray-200">Feedback Loop Statistiken</h2>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <StatCard label="V2 Strukturcheck FAIL" value={`${FEEDBACK_STATS.v2.failRate}%`} sub={`${FEEDBACK_STATS.v2.fail}/126 überarbeitet`} color="border-cyan-800 bg-cyan-950" />
          <StatCard label="V2 Outputs gesamt" value="126" sub="7 Kategorien × 2 Prompts × 3 Modelle × 3 Reps" color="border-gray-700 bg-gray-800" />
          <StatCard label="V3 Inhaltscheck FAIL" value={`${FEEDBACK_STATS.v3.failRate}%`} sub={`${FEEDBACK_STATS.v3.fail}/108 überarbeitet`} color="border-emerald-800 bg-emerald-950" />
          <StatCard label="Human Review (Orthography)" value={`${FEEDBACK_STATS.v3.humanReview}`} sub="Kein automatischer Inhaltscheck" color="border-yellow-800 bg-yellow-950" />
        </div>
      </div>

      {/* Model Averages */}
      <div>
        <h2 className="text-xl font-semibold mb-4 text-gray-200">Durchschnittliche Scores pro Modell</h2>
        <ModelAverages />
      </div>

      {/* Per-Model Bar Chart */}
      <div>
        <h2 className="text-xl font-semibold mb-4 text-gray-200">Scores nach Kategorie</h2>
        <div className="flex gap-2 mb-4">
          {MODELS.map(m => (
            <button key={m} onClick={() => setActiveModel(m)}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${activeModel === m ? 'text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}
              style={activeModel === m ? { background: COLORS[m] } : {}}>
              {MODEL_LABELS[m]}
            </button>
          ))}
        </div>
        <div className="bg-gray-800 rounded-xl p-4 border border-gray-700">
          <OverviewChart model={activeModel} />
        </div>
      </div>

      {/* V2→V3 Delta Chart */}
      <div>
        <h2 className="text-xl font-semibold mb-2 text-gray-200">Δ V2 → V3: Verbesserung durch Inhaltscheck</h2>
        <p className="text-gray-400 text-sm mb-4">Positiv = Inhaltscheck hat geholfen, Negativ = Inhaltscheck hat geschadet</p>
        <div className="bg-gray-800 rounded-xl p-4 border border-gray-700">
          <ImprovementChart />
        </div>
      </div>

      {/* Radar Chart */}
      <div>
        <h2 className="text-xl font-semibold mb-4 text-gray-200">Radar: Alle Modelle im Vergleich</h2>
        <div className="flex gap-2 mb-4">
          {[['v2','V2 (Strukturcheck)'],['v3','V3 (Inhaltscheck)']].map(([v,l]) => (
            <button key={v} onClick={() => setRadarVersion(v)}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${radarVersion === v ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}>
              {l}
            </button>
          ))}
        </div>
        <div className="bg-gray-800 rounded-xl p-4 border border-gray-700">
          <RadarOverview version={radarVersion} />
        </div>
      </div>

      {/* Full Score Table */}
      <div>
        <h2 className="text-xl font-semibold mb-4 text-gray-200">Vollständige Score-Tabelle</h2>
        <div className="bg-gray-800 rounded-xl p-4 border border-gray-700">
          <ScoreTable />
        </div>
      </div>

      {/* Key Findings */}
      <div>
        <h2 className="text-xl font-semibold mb-4 text-gray-200">Key Findings</h2>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {[
            { title: "Feedback-Loop kaum Verbesserung", text: "Mit GPT-5.4 als Evaluator zeigt sich: der Feedback-Loop verbessert die Scores kaum. Mistral und Gemma2 schneiden in V2/V3 meist gleich oder schlechter ab als im Orig-Run — trotz 96% Strukturcheck-FAIL und 79% Inhaltscheck-FAIL.", color: "border-cyan-700" },
            { title: "Inhaltscheck: Mistral leicht besser, andere schlechter", text: "V3 (Inhaltscheck) hilft Mistral marginal (+3 Grammar, +3 Gap-Fill), schadet aber Gemma2 (SC: 36→31, Gap-Fill: 31→26) und Qwen3.5 deutlich (Vocab: 32→22, Grammar: 19→15). Der Content-Reviewer erzeugt möglicherweise fehlerhafte Korrekturen.", color: "border-emerald-700" },
            { title: "Evaluator-Konsistenz: GPT-5.4 zuverlässiger", text: "Copilot (alter Evaluator) zeigte massive Schwankungen: SC Mistral 37↔17, Gemma2 26↔39 auf denselben Outputs. GPT-5.4 weicht zwischen zwei Runs nur um ±1-3 Punkte ab — deutlich reproduzierbarer.", color: "border-blue-700" },
            { title: "Qwen3.5 enttäuscht bei späteren Prompts", text: "Qwen3.5:9b schneidet in V2/V3 (Prompts 4-5) schwächer ab als erwartet, besonders bei Grammar (19) und Orthography (15). Zusätzlich ist es mit Ø 133s/Output das langsamste Modell — schlechte Kosten-Nutzen-Relation im Feedback-Loop.", color: "border-yellow-700" },
          ].map(f => (
            <div key={f.title} className={`bg-gray-800 rounded-xl p-4 border ${f.color}`}>
              <div className="font-semibold text-white mb-2">{f.title}</div>
              <div className="text-gray-300 text-sm">{f.text}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="text-center text-gray-600 text-xs pb-4">
        Diplomarbeit Helikon — Feedback Loop Analysis — {new Date().toLocaleDateString('de-AT')}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
