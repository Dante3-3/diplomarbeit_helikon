<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diplomarbeit: LLM-Evaluation Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
  <script>window.PropTypes = window.PropTypes || window.propTypes;</script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mistral: { light: '#93c5fd', DEFAULT: '#3b82f6', dark: '#1d4ed8' },
            gemma: { light: '#86efac', DEFAULT: '#22c55e', dark: '#15803d' },
            deepseek: { light: '#fdba74', DEFAULT: '#f97316', dark: '#c2410c' },
            euro: { light: '#c4b5fd', DEFAULT: '#8b5cf6', dark: '#6d28d9' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .recharts-default-tooltip { border-radius: 8px !important; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const {
      RadarChart, Radar, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
      ResponsiveContainer, Cell, LabelList
    } = Recharts;

    // ==================== DATA ====================
    const SCORES = [
      { teil: 'Teil 2', kategorie: 'Vocabulary', max: 40, mistral: 34, gemma: 39.1, deepseek: 32, euro: null },
      { teil: 'Teil 3', kategorie: 'Multiple Choice', max: 45, mistral: 32, gemma: 33, deepseek: 35, euro: null },
      { teil: 'Teil 4', kategorie: 'Sentence Completion', max: 40, mistral: 37, gemma: 26, deepseek: 37, euro: null },
      { teil: 'Teil 5', kategorie: 'Grammatik', max: 40, mistral: 25, gemma: 33, deepseek: 30, euro: null },
      { teil: 'Teil 6', kategorie: 'True/False', max: 40, mistral: 36, gemma: 33, deepseek: 35, euro: null },
      { teil: 'Teil 7', kategorie: 'Gap-Fill', max: 40, mistral: 26, gemma: 28.1, deepseek: 26, euro: null },
      { teil: 'Teil 8', kategorie: 'Dt. Rechtschreibung', max: 40, mistral: 15.4, gemma: 25, deepseek: 21, euro: 25 },
    ];

    const MODEL_COLORS = {
      mistral: '#3b82f6',
      gemma: '#22c55e',
      deepseek: '#f97316',
      euro: '#8b5cf6',
    };

    const MODEL_LABELS = {
      mistral: 'Mistral 7B',
      gemma: 'Gemma2 9B',
      deepseek: 'DeepSeek-R1 8B',
      euro: 'EuroLLM',
    };

    // Response time data (from results.jsonl analysis)
    const RESPONSE_TIMES = {
      mistral: { avg: 22.5, min: 9.2, max: 64.3, n: 63 },
      gemma: { avg: 22.0, min: 10.1, max: 63.3, n: 63 },
      deepseek: { avg: 119.5, min: 24.8, max: 868.5, n: 63 },
      euro: { avg: 95.6, min: 78.1, max: 114.6, n: 9 },
    };

    // Response lengths per model/teil (avg chars)
    const RESPONSE_LENGTHS = {
      mistral: { teil2: 2144, teil3: 2063, teil4: 1413, teil5: 2075, teil6: 1361, teil7: 2146, teil8: 2805 },
      gemma: { teil2: 2163, teil3: 2582, teil4: 1164, teil5: 1770, teil6: 1335, teil7: 1835, teil8: 2378 },
      deepseek: { teil2: 1740, teil3: 2399, teil4: 1550, teil5: 1981, teil6: 1122, teil7: 2283, teil8: 2640 },
      euro: { teil8: 2573 },
    };

    // ==================== COMPONENTS ====================

    function Header() {
      return (
        <div className="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white py-12 px-6 mb-8 rounded-b-2xl shadow-lg">
          <div className="max-w-7xl mx-auto">
            <h1 className="text-3xl md:text-4xl font-bold mb-3">
              Diplomarbeit: LLM-Evaluation fur CLIL-Materialerstellung
            </h1>
            <p className="text-blue-100 text-lg mb-6 max-w-3xl">
              Vergleichende Analyse von Open-Source Large Language Models bei der Erstellung
              von englischsprachigen CLIL-Unterrichtsmaterialien auf B2-Niveau.
            </p>
            <div className="flex flex-wrap gap-4">
              <StatBadge value="198" label="Outputs generiert" />
              <StatBadge value="3+1" label="Modelle getestet" />
              <StatBadge value="7" label="Aufgabenkategorien" />
              <StatBadge value="3" label="Wiederholungen" />
            </div>
          </div>
        </div>
      );
    }

    function StatBadge({ value, label }) {
      return (
        <div className="bg-white/15 backdrop-blur-sm rounded-lg px-4 py-2 border border-white/20">
          <div className="text-2xl font-bold">{value}</div>
          <div className="text-blue-200 text-sm">{label}</div>
        </div>
      );
    }

    function Card({ title, subtitle, children, className = '' }) {
      return (
        <div className={`bg-white rounded-xl shadow-md border border-gray-100 p-6 mb-6 ${className}`}>
          <h2 className="text-xl font-bold text-gray-800 mb-1">{title}</h2>
          {subtitle && <p className="text-gray-500 text-sm mb-4">{subtitle}</p>}
          {children}
        </div>
      );
    }

    function ModelLegend({ models = ['mistral', 'gemma', 'deepseek'] }) {
      return (
        <div className="flex flex-wrap gap-4 mb-4">
          {models.map(m => (
            <div key={m} className="flex items-center gap-2">
              <div className="w-3 h-3 rounded-full" style={{ backgroundColor: MODEL_COLORS[m] }} />
              <span className="text-sm text-gray-600">{MODEL_LABELS[m]}</span>
            </div>
          ))}
        </div>
      );
    }

    // 1. Radar Chart
    function RadarOverview() {
      const radarData = SCORES.map(s => ({
        kategorie: s.kategorie,
        mistral: Math.round((s.mistral / s.max) * 100),
        gemma: Math.round((s.gemma / s.max) * 100),
        deepseek: Math.round((s.deepseek / s.max) * 100),
      }));

      const totals = { mistral: 0, gemma: 0, deepseek: 0 };
      SCORES.forEach(s => {
        totals.mistral += s.mistral / s.max;
        totals.gemma += s.gemma / s.max;
        totals.deepseek += s.deepseek / s.max;
      });
      const avgPct = {
        mistral: (totals.mistral / 7 * 100).toFixed(1),
        gemma: (totals.gemma / 7 * 100).toFixed(1),
        deepseek: (totals.deepseek / 7 * 100).toFixed(1),
      };

      const best = Object.entries(avgPct).sort((a, b) => b[1] - a[1])[0];
      const worst = Object.entries(avgPct).sort((a, b) => a[1] - b[1])[0];

      return (
        <Card
          title="Gesamtubersicht: Modellvergleich"
          subtitle="Normalisierte Scores (0-100%) uber alle 7 Kategorien"
        >
          <ModelLegend />
          <div className="flex flex-col lg:flex-row items-center gap-6">
            <div className="w-full lg:w-2/3" style={{ height: 400 }}>
              <ResponsiveContainer>
                <RadarChart data={radarData}>
                  <PolarGrid stroke="#e5e7eb" />
                  <PolarAngleAxis dataKey="kategorie" tick={{ fontSize: 11, fill: '#6b7280' }} />
                  <PolarRadiusAxis angle={90} domain={[0, 100]} tick={{ fontSize: 10 }} />
                  <Radar name="Mistral" dataKey="mistral" stroke={MODEL_COLORS.mistral} fill={MODEL_COLORS.mistral} fillOpacity={0.15} strokeWidth={2} />
                  <Radar name="Gemma2" dataKey="gemma" stroke={MODEL_COLORS.gemma} fill={MODEL_COLORS.gemma} fillOpacity={0.15} strokeWidth={2} />
                  <Radar name="DeepSeek" dataKey="deepseek" stroke={MODEL_COLORS.deepseek} fill={MODEL_COLORS.deepseek} fillOpacity={0.15} strokeWidth={2} />
                  <Tooltip />
                </RadarChart>
              </ResponsiveContainer>
            </div>
            <div className="lg:w-1/3 space-y-3">
              <div className="p-4 bg-blue-50 rounded-lg border border-blue-200">
                <div className="text-sm text-blue-600 font-medium">Durchschnitt</div>
                {Object.entries(avgPct).sort((a,b) => b[1]-a[1]).map(([m, pct]) => (
                  <div key={m} className="flex justify-between items-center mt-1">
                    <span className="text-sm font-medium" style={{color: MODEL_COLORS[m]}}>{MODEL_LABELS[m]}</span>
                    <span className="font-bold text-gray-800">{pct}%</span>
                  </div>
                ))}
              </div>
              <div className="p-3 bg-green-50 rounded-lg border border-green-200 text-sm">
                <span className="font-semibold text-green-700">Bestes Modell:</span>{' '}
                <span style={{color: MODEL_COLORS[best[0]]}} className="font-bold">{MODEL_LABELS[best[0]]}</span> mit {best[1]}%
              </div>
              <div className="p-3 bg-orange-50 rounded-lg border border-orange-200 text-sm">
                <span className="font-semibold text-orange-700">Schwachstes Modell:</span>{' '}
                <span style={{color: MODEL_COLORS[worst[0]]}} className="font-bold">{MODEL_LABELS[worst[0]]}</span> mit {worst[1]}%
              </div>
            </div>
          </div>
        </Card>
      );
    }

    // 2. Heatmap Table
    function ScoreHeatmap() {
      const getColor = (score, max) => {
        const pct = score / max;
        if (pct >= 0.85) return 'bg-green-100 text-green-800';
        if (pct >= 0.70) return 'bg-green-50 text-green-700';
        if (pct >= 0.55) return 'bg-yellow-50 text-yellow-700';
        if (pct >= 0.40) return 'bg-orange-50 text-orange-700';
        return 'bg-red-50 text-red-700';
      };

      const getBgStyle = (score, max) => {
        const pct = score / max;
        const h = pct >= 0.6 ? 120 + (pct - 0.6) * 150 : pct * 200;
        const s = 60 + pct * 20;
        const l = 90 - pct * 25;
        return { backgroundColor: `hsl(${h}, ${s}%, ${l}%)` };
      };

      return (
        <Card
          title="Score-Tabelle mit Heatmap"
          subtitle="Farbcodiert: grun = gut, rot/gelb = schwach. Rohpunkte und Prozent."
        >
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b-2 border-gray-200">
                  <th className="text-left py-3 px-3 font-semibold text-gray-600">Teil</th>
                  <th className="text-left py-3 px-3 font-semibold text-gray-600">Kategorie</th>
                  <th className="text-center py-3 px-3 font-semibold text-gray-600">Max</th>
                  <th className="text-center py-3 px-3 font-semibold" style={{color: MODEL_COLORS.mistral}}>Mistral 7B</th>
                  <th className="text-center py-3 px-3 font-semibold" style={{color: MODEL_COLORS.gemma}}>Gemma2 9B</th>
                  <th className="text-center py-3 px-3 font-semibold" style={{color: MODEL_COLORS.deepseek}}>DeepSeek-R1 8B</th>
                  <th className="text-center py-3 px-3 font-semibold" style={{color: MODEL_COLORS.euro}}>EuroLLM</th>
                </tr>
              </thead>
              <tbody>
                {SCORES.map((s, i) => (
                  <tr key={i} className="border-b border-gray-100 hover:bg-gray-50 transition-colors">
                    <td className="py-3 px-3 font-medium text-gray-800">{s.teil}</td>
                    <td className="py-3 px-3 text-gray-600">{s.kategorie}</td>
                    <td className="py-3 px-3 text-center text-gray-500">{s.max}</td>
                    {['mistral', 'gemma', 'deepseek', 'euro'].map(m => (
                      <td key={m} className="py-2 px-3 text-center">
                        {s[m] !== null ? (
                          <span className={`inline-block px-3 py-1 rounded-md font-medium ${getColor(s[m], s.max)}`}>
                            {s[m]}/{s.max} ({Math.round(s[m]/s.max*100)}%)
                          </span>
                        ) : (
                          <span className="text-gray-300">--</span>
                        )}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr className="border-t-2 border-gray-300 bg-gray-50 font-bold">
                  <td className="py-3 px-3" colSpan="2">Gesamt</td>
                  <td className="py-3 px-3 text-center">{SCORES.reduce((a,s) => a+s.max, 0)}</td>
                  {['mistral', 'gemma', 'deepseek'].map(m => {
                    const total = SCORES.reduce((a,s) => a + (s[m] || 0), 0);
                    const max = SCORES.reduce((a,s) => a + s.max, 0);
                    return (
                      <td key={m} className="py-3 px-3 text-center">
                        <span className="text-gray-800">{total}/{max} ({Math.round(total/max*100)}%)</span>
                      </td>
                    );
                  })}
                  <td className="py-3 px-3 text-center text-gray-400">nur Teil 8</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </Card>
      );
    }

    // 3. Grouped Bar Chart
    function CategoryBarChart() {
      const data = SCORES.map(s => ({
        name: s.kategorie,
        Mistral: Math.round(s.mistral / s.max * 100),
        Gemma2: Math.round(s.gemma / s.max * 100),
        DeepSeek: Math.round(s.deepseek / s.max * 100),
      }));

      return (
        <Card
          title="Scores pro Kategorie"
          subtitle="Normalisiert auf Prozent, 3 Modelle im Vergleich"
        >
          <ModelLegend />
          <div style={{ height: 400 }}>
            <ResponsiveContainer>
              <BarChart data={data} margin={{ top: 5, right: 30, left: 0, bottom: 5 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                <XAxis dataKey="name" tick={{ fontSize: 11 }} angle={-20} textAnchor="end" height={60} />
                <YAxis domain={[0, 100]} tick={{ fontSize: 11 }} label={{ value: '%', position: 'insideTopLeft', fontSize: 12 }} />
                <Tooltip formatter={(v) => `${v}%`} />
                <Bar dataKey="Mistral" fill={MODEL_COLORS.mistral} radius={[4, 4, 0, 0]} />
                <Bar dataKey="Gemma2" fill={MODEL_COLORS.gemma} radius={[4, 4, 0, 0]} />
                <Bar dataKey="DeepSeek" fill={MODEL_COLORS.deepseek} radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </Card>
      );
    }

    // 4. Response Times
    function ResponseTimesChart() {
      const data = Object.entries(RESPONSE_TIMES).map(([m, d]) => ({
        name: MODEL_LABELS[m],
        avg: d.avg,
        min: d.min,
        max: d.max,
        color: MODEL_COLORS[m],
        n: d.n,
      }));

      return (
        <Card
          title="Antwortzeiten-Analyse"
          subtitle="Durchschnittliche, minimale und maximale Generierungszeit pro Modell (Sekunden)"
        >
          <div className="flex flex-col lg:flex-row gap-6">
            <div className="w-full lg:w-2/3" style={{ height: 350 }}>
              <ResponsiveContainer>
                <BarChart data={data} margin={{ top: 20, right: 30, left: 0, bottom: 5 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                  <XAxis dataKey="name" tick={{ fontSize: 11 }} />
                  <YAxis tick={{ fontSize: 11 }} label={{ value: 'Sekunden', angle: -90, position: 'insideLeft', fontSize: 12 }} />
                  <Tooltip formatter={(v) => `${v.toFixed(1)}s`} />
                  <Bar dataKey="avg" name="Durchschnitt" radius={[4, 4, 0, 0]}>
                    {data.map((entry, i) => (
                      <Cell key={i} fill={entry.color} />
                    ))}
                    <LabelList dataKey="avg" position="top" formatter={(v) => `${v.toFixed(1)}s`} style={{ fontSize: 11, fontWeight: 600 }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div className="lg:w-1/3 space-y-3">
              {data.map(d => (
                <div key={d.name} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                  <div className="font-medium text-sm" style={{ color: d.color }}>{d.name}</div>
                  <div className="grid grid-cols-3 gap-2 mt-1 text-xs text-gray-600">
                    <div><span className="font-semibold">Min:</span> {d.min.toFixed(1)}s</div>
                    <div><span className="font-semibold">Avg:</span> {d.avg.toFixed(1)}s</div>
                    <div><span className="font-semibold">Max:</span> {d.max.toFixed(1)}s</div>
                  </div>
                  <div className="text-xs text-gray-400 mt-1">{d.n} Durchlaufe</div>
                </div>
              ))}
              <div className="p-3 bg-amber-50 rounded-lg border border-amber-200 text-sm text-amber-800">
                <span className="font-semibold">Hinweis:</span> DeepSeek-R1 ist mit durchschnittlich 119,5s deutlich langsamer als Mistral und Gemma2 (~22s), da es intern eine "Chain-of-Thought"-Reasoning-Phase durchlauft.
              </div>
            </div>
          </div>
        </Card>
      );
    }

    // 5. Output Length Heatmap
    function OutputLengthHeatmap() {
      const teils = ['teil2', 'teil3', 'teil4', 'teil5', 'teil6', 'teil7', 'teil8'];
      const teilLabels = { teil2: 'Teil 2', teil3: 'Teil 3', teil4: 'Teil 4', teil5: 'Teil 5', teil6: 'Teil 6', teil7: 'Teil 7', teil8: 'Teil 8' };
      const models = ['mistral', 'gemma', 'deepseek'];

      const allValues = [];
      models.forEach(m => teils.forEach(t => {
        if (RESPONSE_LENGTHS[m][t]) allValues.push(RESPONSE_LENGTHS[m][t]);
      }));
      const maxLen = Math.max(...allValues);
      const minLen = Math.min(...allValues);

      const getHeatColor = (val) => {
        if (!val) return '#f3f4f6';
        const pct = (val - minLen) / (maxLen - minLen);
        const h = 220 - pct * 180;
        return `hsl(${h}, 70%, ${85 - pct * 30}%)`;
      };

      return (
        <Card
          title="Output-Langen-Analyse"
          subtitle="Durchschnittliche Zeichenlange der Responses pro Modell und Teil (je 9 Outputs)"
        >
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b-2 border-gray-200">
                  <th className="text-left py-3 px-3 font-semibold text-gray-600">Modell</th>
                  {teils.map(t => (
                    <th key={t} className="text-center py-3 px-3 font-semibold text-gray-600">{teilLabels[t]}</th>
                  ))}
                  <th className="text-center py-3 px-3 font-semibold text-gray-600">Avg</th>
                </tr>
              </thead>
              <tbody>
                {models.map(m => {
                  const vals = teils.map(t => RESPONSE_LENGTHS[m][t] || 0);
                  const avg = Math.round(vals.reduce((a, v) => a + v, 0) / vals.filter(v => v > 0).length);
                  return (
                    <tr key={m} className="border-b border-gray-100">
                      <td className="py-3 px-3 font-medium" style={{ color: MODEL_COLORS[m] }}>{MODEL_LABELS[m]}</td>
                      {teils.map(t => (
                        <td key={t} className="py-2 px-3 text-center">
                          {RESPONSE_LENGTHS[m][t] ? (
                            <span className="inline-block px-3 py-1 rounded-md font-medium text-gray-700"
                              style={{ backgroundColor: getHeatColor(RESPONSE_LENGTHS[m][t]) }}>
                              {RESPONSE_LENGTHS[m][t].toLocaleString()}
                            </span>
                          ) : <span className="text-gray-300">--</span>}
                        </td>
                      ))}
                      <td className="py-2 px-3 text-center font-semibold text-gray-700">{avg.toLocaleString()}</td>
                    </tr>
                  );
                })}
                <tr className="border-b border-gray-100">
                  <td className="py-3 px-3 font-medium" style={{ color: MODEL_COLORS.euro }}>{MODEL_LABELS.euro}</td>
                  {teils.map(t => (
                    <td key={t} className="py-2 px-3 text-center">
                      {RESPONSE_LENGTHS.euro[t] ? (
                        <span className="inline-block px-3 py-1 rounded-md font-medium text-gray-700"
                          style={{ backgroundColor: getHeatColor(RESPONSE_LENGTHS.euro[t]) }}>
                          {RESPONSE_LENGTHS.euro[t].toLocaleString()}
                        </span>
                      ) : <span className="text-gray-300">--</span>}
                    </td>
                  ))}
                  <td className="py-2 px-3 text-center font-semibold text-gray-700">{RESPONSE_LENGTHS.euro.teil8?.toLocaleString()}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div className="mt-4 p-3 bg-gray-50 rounded-lg text-sm text-gray-600">
            <span className="font-semibold">Erkenntnis:</span> Die Output-Langen variieren moderat zwischen Modellen. Mistral tendiert zu etwas langeren Antworten bei Teil 8 (Dt. Rechtschreibung), wahrend Gemma2 bei Teil 4 (Sentence Completion) die kurzesten Outputs produziert.
          </div>
        </Card>
      );
    }

    // 6. Teil 8 Special Comparison
    function Teil8Comparison() {
      const teil8 = SCORES.find(s => s.teil === 'Teil 8');
      const data = [
        { name: 'Mistral 7B', score: teil8.mistral, pct: Math.round(teil8.mistral / teil8.max * 100), color: MODEL_COLORS.mistral },
        { name: 'Gemma2 9B', score: teil8.gemma, pct: Math.round(teil8.gemma / teil8.max * 100), color: MODEL_COLORS.gemma },
        { name: 'DeepSeek-R1 8B', score: teil8.deepseek, pct: Math.round(teil8.deepseek / teil8.max * 100), color: MODEL_COLORS.deepseek },
        { name: 'EuroLLM', score: teil8.euro, pct: Math.round(teil8.euro / teil8.max * 100), color: MODEL_COLORS.euro },
      ];

      return (
        <Card
          title="Teil 8: Deutsche Rechtschreibung — Sondervergleich"
          subtitle="Einzige Kategorie mit allen 4 Modellen (inkl. EuroLLM). Max: 40 Punkte"
        >
          <div className="flex flex-col lg:flex-row gap-6">
            <div className="w-full lg:w-2/3" style={{ height: 300 }}>
              <ResponsiveContainer>
                <BarChart data={data} margin={{ top: 20, right: 30, left: 0, bottom: 5 }} layout="vertical">
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" />
                  <XAxis type="number" domain={[0, 40]} tick={{ fontSize: 11 }} />
                  <YAxis type="category" dataKey="name" tick={{ fontSize: 12 }} width={120} />
                  <Tooltip formatter={(v) => `${v}/40`} />
                  <Bar dataKey="score" name="Punkte" radius={[0, 4, 4, 0]} barSize={35}>
                    {data.map((entry, i) => (
                      <Cell key={i} fill={entry.color} />
                    ))}
                    <LabelList dataKey="score" position="right" formatter={(v) => `${v}/40 (${Math.round(v/40*100)}%)`} style={{ fontSize: 12, fontWeight: 600, fill: '#374151' }} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <div className="lg:w-1/3 space-y-3">
              <div className="p-4 bg-purple-50 rounded-lg border border-purple-200 text-sm">
                <div className="font-semibold text-purple-800 mb-2">EuroLLM im Vergleich</div>
                <p className="text-purple-700">
                  Das speziell fur europaische Sprachen trainierte EuroLLM-Modell erreicht bei der
                  deutschen Rechtschreibung <span className="font-bold">25/40 (63%)</span> und liegt damit gleichauf mit Gemma2 9B.
                  Es ubertrifft sowohl DeepSeek-R1 als auch Mistral in dieser Kategorie.
                </p>
              </div>
              <div className="p-4 bg-red-50 rounded-lg border border-red-200 text-sm">
                <div className="font-semibold text-red-800 mb-2">Schwachste Kategorie</div>
                <p className="text-red-700">
                  Deutsche Rechtschreibung ist die schwachste Kategorie fur alle Modelle.
                  Mistral erreicht nur 38,5% — ein deutlicher Abfall gegenuber seinen Starken
                  in Vocabulary (85%) und Sentence Completion (92,5%).
                </p>
              </div>
            </div>
          </div>
        </Card>
      );
    }
